<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>lyrics_AHB</title>
<style>
@font-face{
  font-family:'LINESeedSans Bd';
  src:url('/fonts/LINESeedSans_Bd.otf') format('opentype');
  font-weight:700;
  font-style:normal;
  font-display:swap;
}
:root{
  --bg:#0a0a12; --select-bg:#12121e;
  --surface:rgba(255,255,255,.05); --surface-raised:rgba(255,255,255,.09);
  --border:rgba(255,255,255,.14); --border-hover:rgba(167,139,250,.65);
  --ink:#ffffff; --ink-muted:rgba(255,255,255,.68); --ink-dim:rgba(255,255,255,.5);
  --placeholder:rgba(255,255,255,.5);
  --pill-bg:rgba(10,10,18,.72); --pill-border:rgba(255,255,255,.12);
  --status-bg:rgba(10,10,18,.78);
  --selection-bg:rgba(167,139,250,.3);
  --accent:#7c6aef; --accent-strong:#8d7dff; --accent-deep:#b8a9ff;
  --accent-glow:rgba(124,106,239,.45); --accent-ring:rgba(124,106,239,.18);
  --accent-soft:rgba(124,106,239,.12); --accent-hover:rgba(167,139,250,.25);
  --accent-border:rgba(167,139,250,.4);
  --on-accent:#fff;
  --glow-a:rgba(56,189,248,.15); --glow-b:rgba(167,139,250,.18); --glow-c:rgba(244,114,182,.12);
  --spot-top:rgba(167,139,250,.26); --spot-mid:rgba(124,106,239,.11);
  --mouse-top:rgba(167,139,250,.055); --mouse-mid:rgba(124,106,239,.02);
  --upload-glow:rgba(124,106,239,.09);
  --lit-shadow-mid:rgba(124,106,239,.35); --lit-shadow-far:rgba(167,139,250,.18);
  --intro-shadow:rgba(124,106,239,.3);
  --word-active:#fff; --ok:#5eead4; --err:#fb7185;
  --radius-xs:8px; --radius-sm:10px; --radius-md:14px; --radius-pill:999px;
  --font-display:'LINESeedSans Bd','Segoe UI',system-ui,sans-serif;
  --font-ui:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --ease:cubic-bezier(.22,.9,.32,1);
  --z-glow:1; --z-stage:3; --z-ui:8; --z-upload:15; --z-status:16; --z-intro:20; --z-fs:50;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-ui);
  width:100vw; height:100vh; overflow:hidden; position:relative;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 55% 45% at 15% 0%,var(--glow-a),transparent 60%),
    radial-gradient(ellipse 50% 40% at 85% 15%,var(--glow-b),transparent 60%),
    radial-gradient(ellipse 60% 45% at 50% 110%,var(--glow-c),transparent 60%);
}
::selection{background:var(--selection-bg)}

/* ================= spotlight ================= */
#spotlight{
  position:fixed; width:520px; height:520px; border-radius:50%; z-index:var(--z-glow);
  pointer-events:none; mix-blend-mode:screen; filter:blur(48px);
  background:radial-gradient(circle,var(--spot-top) 0%,var(--spot-mid) 40%,transparent 70%);
  transform:translate(-50%,-50%); opacity:0; will-change:left,top;
  transition:opacity .5s ease;
}
#spotlight.on{opacity:1}
#mouseGlow{
  position:fixed; width:300px; height:300px; border-radius:50%; z-index:var(--z-glow);
  pointer-events:none; mix-blend-mode:screen; filter:blur(55px);
  background:radial-gradient(circle,var(--mouse-top) 0%,var(--mouse-mid) 45%,transparent 70%);
  transform:translate(-50%,-50%); opacity:0; will-change:left,top; transition:opacity .5s ease;
}
#mouseGlow.on{opacity:1}

/* ================= lyrics viewport ================= */
.lyrics-viewport{
  position:fixed; inset:0; z-index:var(--z-stage); overflow:hidden;
  -webkit-mask-image:linear-gradient(to bottom,transparent,black 18%,black 82%,transparent);
  mask-image:linear-gradient(to bottom,transparent,black 18%,black 82%,transparent);
  display:flex; align-items:center; justify-content:center;
}
.lyrics-track{
  position:absolute; left:0; right:0; top:0; padding:0 8vw;
  transition:transform .35s var(--ease);
}
.lyric-line{
  display:flex; flex-wrap:wrap; justify-content:center; align-items:baseline; gap:.4em;
  padding:13px 0; line-height:1.5; text-align:center;
  font-family:var(--font-display); font-weight:700;
  font-size:clamp(18px,3vw,24px);
  opacity:.65;
  transition:opacity .3s ease, font-size .35s var(--ease), transform .35s var(--ease);
  cursor:pointer; border-radius:var(--radius-xs);
}
.lyric-line:hover{opacity:.85}
.lyric-line.near{opacity:.82}
.lyric-line.active{
  opacity:1;
  font-size:clamp(22px,3.6vw,30px);
  transform:scale(1.02);
}
.lyric-line.past{opacity:.42}
.word{
  display:inline-block;
  color:var(--ink-dim);
  transition:color .25s ease, transform .25s var(--ease), text-shadow .25s ease;
}
.word.sung{color:rgba(255,255,255,.78)}
.word.lit{
  color:var(--word-active);
  transform:translateY(-2px) scale(1.05);
  text-shadow:0 0 12px var(--accent-glow), 0 0 34px var(--lit-shadow-mid), 0 0 60px var(--lit-shadow-far);
}

/* ================= intro ================= */
.intro{
  position:fixed; inset:0; z-index:var(--z-intro); display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center;
  background:var(--bg); pointer-events:none;
  animation:intro-fade .6s ease .6s forwards;
}
.intro h1{
  font-family:var(--font-display); font-size:clamp(40px,8vw,72px);
  font-weight:700; letter-spacing:.18em; text-transform:uppercase;
  color:var(--word-active); text-shadow:0 0 30px var(--accent-glow), 0 0 90px var(--intro-shadow);
}
.intro .tagline{margin-top:14px;font-size:13px;color:var(--ink-muted);letter-spacing:.02em}
.intro.hide{opacity:0;transform:translateY(-16px) scale(.98)}
.intro.hide+*{pointer-events:auto}
@keyframes intro-fade{0%{opacity:1}100%{opacity:0;visibility:hidden}}

/* ================= brand ================= */
.brand-mark{
  position:fixed; top:22px; left:24px; z-index:var(--z-ui);
  font-family:var(--font-display); font-size:11px; letter-spacing:.22em;
  color:var(--ink-muted); opacity:.55; text-transform:uppercase;
}

/* ================= upload overlay ================= */
.upload-overlay{
  position:fixed; inset:0; z-index:var(--z-upload);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:
    radial-gradient(ellipse 60% 50% at 50% 18%, var(--upload-glow), transparent 55%),
    var(--bg);
  transition:opacity .4s ease, visibility .4s;
}
.upload-overlay.hidden{opacity:0;pointer-events:none;visibility:hidden}
.upload-box{
  width:100%; max-width:480px; padding:0 24px;
  display:flex; flex-direction:column; gap:14px;
}
.upload-title{
  font-family:var(--font-display); font-size:22px; font-weight:700;
  letter-spacing:.03em; text-align:center; margin-bottom:2px; color:var(--ink);
}
.upload-sub{
  text-align:center; font-size:13px; color:var(--ink-muted); letter-spacing:.01em;
  margin-bottom:6px;
}
.lang-row{display:flex;justify-content:space-between;align-items:center;padding:2px}
.lang-label{font-size:12px;font-weight:500;color:var(--ink-muted);letter-spacing:.02em}
.lang-select{
  background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:7px 10px;color:var(--ink);font-family:var(--font-ui);font-size:13px;outline:none;cursor:pointer;
  transition:border-color .15s;
}
.lang-select:hover{border-color:var(--border-hover)}
.lang-select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.lang-select option{background:var(--select-bg);color:var(--ink)}
.upload-zone{
  border:1.5px dashed var(--border);border-radius:var(--radius-md);padding:38px 24px;
  text-align:center;cursor:pointer;transition:border-color .2s,background .2s,transform .2s;
}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--accent);background:var(--surface)}
.upload-zone.dragover{transform:scale(1.012);border-color:var(--accent-strong)}
.upload-zone .icon{font-size:1.6rem;margin-bottom:10px;opacity:.6;color:var(--accent);text-shadow:0 0 18px var(--accent-glow)}
.upload-zone p{color:var(--ink-muted);font-size:14px;font-weight:500}
.upload-zone .hint{margin-top:6px;font-size:12px;color:var(--ink-dim);font-weight:400;letter-spacing:.02em}
.upload-zone input{display:none}
.divider{
  display:flex;align-items:center;gap:12px;color:var(--ink-dim);font-size:11px;
  letter-spacing:.08em;text-transform:uppercase;padding:2px 0;
}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.url-row,.official-row{display:flex;gap:8px}
.url-input{
  flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:10px 14px;color:var(--ink);font-family:var(--font-ui);
  font-size:13.5px;outline:none;transition:border-color .15s,box-shadow .15s;
}
.url-input::placeholder{color:var(--placeholder)}
.url-input:hover{border-color:var(--border-hover)}
.url-input:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}
.url-btn{
  background:var(--accent);color:var(--on-accent);border:none;border-radius:var(--radius-sm);
  padding:10px 18px;font-family:var(--font-ui);font-size:13.5px;font-weight:600;letter-spacing:.01em;
  cursor:pointer;transition:background .15s,transform .1s,opacity .15s;white-space:nowrap;
}
.url-btn:hover{background:var(--accent-strong)}
.url-btn:active{transform:scale(.98)}
.url-btn:disabled{opacity:.45;cursor:default}
.url-btn:focus-visible{outline:2px solid var(--accent-strong);outline-offset:2px}

/* ================= controls pill ================= */
.controls-group{
  position:fixed; bottom:calc(20px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); z-index:var(--z-ui);
  display:flex; flex-direction:column; align-items:center; gap:8px;
  opacity:0; transition:opacity .25s ease; pointer-events:none;
}
.controls-group.show{opacity:1;pointer-events:auto}
.controls-pill{
  display:flex; align-items:center; gap:10px;
  background:var(--pill-bg); border:1px solid var(--pill-border);
  -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px);
  border-radius:var(--radius-pill); padding:8px 14px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}
.ctrl-btn{
  width:34px;height:34px;border-radius:50%;flex:none;
  border:1px solid var(--accent-border);background:var(--accent-soft);
  color:var(--word-active);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:background .15s,border-color .15s,transform .1s;font-size:.75rem;
}
.ctrl-btn:hover{background:var(--accent-hover);border-color:var(--accent-strong)}
.ctrl-btn:active{transform:scale(.94)}
.ctrl-btn svg{width:13px;height:13px}
.ctrl-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.scrub-track{
  position:relative;width:200px;height:4px;border-radius:4px;
  background:rgba(255,255,255,.12);cursor:pointer;
}
.scrub-track::before{content:'';position:absolute;left:-8px;right:-8px;top:-12px;bottom:-12px}
.scrub-fill{
  position:absolute;inset:0 auto 0 0;width:0%;border-radius:4px;
  background:linear-gradient(90deg,var(--accent),var(--accent-deep));
}
.scrub-knob{
  position:absolute;top:50%;left:0%;width:11px;height:11px;border-radius:50%;
  background:var(--word-active);transform:translate(-50%,-50%);
  box-shadow:0 0 10px var(--accent-glow);
}
.time-caption{font-family:var(--font-ui);font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--ink-muted);white-space:nowrap}
.speed-btn{
  background:none;border:1px solid var(--border);color:var(--ink-muted);
  font-family:var(--font-ui);font-weight:500;padding:4px 8px;border-radius:6px;font-size:11.5px;
  cursor:pointer;transition:border-color .15s,color .15s;
}
.speed-btn:hover{border-color:var(--accent);color:var(--ink)}
.speed-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vol-wrap{display:flex;align-items:center;gap:4px}
.vol-icon{color:var(--ink-muted);font-size:.8rem;cursor:pointer}
.vol-slider{
  -webkit-appearance:none;appearance:none;width:60px;height:3px;
  background:var(--border);border-radius:2px;outline:none;cursor:pointer;
}
.vol-slider::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:var(--accent);cursor:pointer}
.vol-slider::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--accent);cursor:pointer;border:none}

/* ================= status ================= */
#statusArea{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:var(--z-status);
  display:flex;justify-content:center;pointer-events:none;
}
#statusArea .status{
  display:inline-flex;align-items:center;gap:8px;max-width:80vw;
  padding:8px 14px;border-radius:var(--radius-pill);
  color:var(--ink);font-size:12.5px;font-family:var(--font-ui);letter-spacing:.01em;
  background:var(--status-bg);border:1px solid var(--border);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:0 8px 24px rgba(0,0,0,.3);
}
#statusArea .status.loading::after{
  content:'';display:inline-block;width:12px;height:12px;flex:none;
  border:1.5px solid var(--border);border-top-color:var(--accent);
  border-radius:50%;animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ================= tool row ================= */
.tool-row{
  position:fixed;top:22px;right:24px;z-index:var(--z-ui);
  display:flex;gap:8px;align-items:center;
}
.tool-btn{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--ink-muted);
  font-family:var(--font-ui);font-size:11.5px;font-weight:500;letter-spacing:.01em;
  padding:6px 12px;border-radius:var(--radius-pill);cursor:pointer;
  transition:border-color .15s,color .15s,background .15s;
}
.tool-btn:hover{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.tool-btn:disabled{opacity:.35;cursor:default}
.tool-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ================= official row ================= */
.official-row-inner{display:flex;gap:8px;margin-top:10px}

/* ================= keyboard hint ================= */
.kbd-hint{font-family:var(--font-ui);font-size:11px;color:var(--ink-dim);text-align:center;letter-spacing:.02em}
.kbd-hint kbd{
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  border-radius:5px;padding:1px 6px;color:var(--ink-muted);
}

/* ================= fullscreen ================= */
.fs-overlay{
  display:none;position:fixed;inset:0;z-index:var(--z-fs);background:var(--bg);flex-direction:column;align-items:center;justify-content:center;
}
.fs-overlay.active{display:flex}
.fs-lyrics{
  width:100%;max-width:820px;flex:1;overflow-y:auto;padding:38vh 28px 38vh;scroll-behavior:smooth;
}
.fs-lyrics::-webkit-scrollbar{width:0}
.fs-lyrics .lyric-line{padding:14px 16px}
.fs-lyrics .lyric-line.future .word{font-size:1.15rem}
.fs-lyrics .lyric-line.past .word{font-size:1.15rem}
.fs-lyrics .lyric-line.active{padding:28px 16px}
.fs-lyrics .lyric-line.active .word{font-size:2rem}
.fs-controls{
  width:100%;padding:18px 28px calc(18px + env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:16px;
  border-top:1px solid rgba(255,255,255,.08);
}
.fs-controls .scrub-track{flex:1}
.fs-exit{
  background:transparent;border:1px solid var(--border);color:var(--ink-muted);
  font-family:var(--font-ui);font-size:12px;font-weight:500;
  padding:7px 14px;border-radius:var(--radius-pill);cursor:pointer;
  transition:border-color .15s,color .15s,background .15s;
}
.fs-exit:hover{border-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
.fs-exit:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fs-time{font-family:var(--font-ui);font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink-muted);white-space:nowrap}

@media (max-width:600px){
  .lyrics-track{padding:0 6vw}
  .upload-box{padding:0 16px}
  .controls-pill{gap:6px;padding:6px 10px}
  .scrub-track{width:110px}
  .vol-slider{display:none}
  .time-caption{font-size:11px}
  .ctrl-btn{width:40px;height:40px}
  .url-btn{padding:10px 14px}
  #statusArea{top:60px}
  .kbd-hint{display:none}
  .brand-mark{left:18px;top:18px}
  .tool-row{right:18px;top:18px}
}
@media (max-width:420px){
  .lang-row{flex-direction:column;align-items:stretch;gap:8px}
  .url-row{flex-direction:column}
  .url-btn{width:100%}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div id="spotlight"></div>
<div id="mouseGlow"></div>

<div class="brand-mark">LYRICS</div>

<div class="tool-row" id="toolBtns" style="display:none;">
  <button class="tool-btn" id="officialBtn" title="Search official lyrics">Official lyrics</button>
  <button class="tool-btn" id="fsBtn" title="Fullscreen (F)">&#9974;</button>
  <button class="tool-btn" id="exportLrc" title="Export .lrc">.lrc</button>
  <button class="tool-btn" id="exportSrt" title="Export .srt">.srt</button>
</div>

<div class="lyrics-viewport" id="lyricsViewport">
  <div class="lyrics-track" id="lyricsTrack"></div>
</div>

<div class="controls-group" id="controlsGroup">
  <div class="controls-pill">
    <button class="ctrl-btn" id="playBtn" aria-label="play/pause">&#9654;</button>
    <div class="scrub-track" id="scrubTrack" tabindex="0">
      <div class="scrub-fill" id="scrubFill"></div>
      <div class="scrub-knob" id="scrubKnob"></div>
    </div>
    <span class="time-caption"><span id="curTime">0:00</span> / <span id="durTime">0:00</span></span>
    <button class="speed-btn" id="speedBtn">1.0x</button>
    <div class="vol-wrap">
      <span class="vol-icon" id="volIcon">&#128266;</span>
      <input type="range" class="vol-slider" id="volSlider" min="0" max="1" step="0.05" value="1">
    </div>
    <button class="ctrl-btn" id="fsBtnPill" aria-label="fullscreen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3m11-5v3a2 2 0 0 1-2 2h-3"/></svg>
    </button>
  </div>
  <p class="kbd-hint" id="kbdHint"></p>
</div>

<div id="statusArea"></div>

<div class="upload-overlay" id="uploadOverlay">
  <div class="upload-box">
    <h2 class="upload-title">Start a session</h2>
    <p class="upload-sub">Drop your track or paste a link &mdash; lyrics align themselves.</p>
    <div class="lang-row">
      <span class="lang-label">Language</span>
      <select id="langSelect" class="lang-select">
        <option value="auto">Auto-detect</option>
        <option value="en" selected>English</option>
        <option value="ar">Arabic</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="ja">Japanese</option>
        <option value="ko">Korean</option>
        <option value="zh">Chinese</option>
        <option value="hi">Hindi</option>
        <option value="pt">Portuguese</option>
        <option value="ru">Russian</option>
        <option value="tr">Turkish</option>
      </select>
    </div>
    <div class="upload-zone" id="dropZone">
      <div class="icon">&#9835;</div>
      <p>Drop an audio file or click to browse</p>
      <p class="hint">MP3 &middot; WAV &middot; FLAC &middot; OGG</p>
      <input type="file" id="fileInput" accept="audio/*">
    </div>
    <div class="divider">or</div>
    <div class="url-row">
      <input type="text" id="urlInput" class="url-input" placeholder="Paste a YouTube URL...">
      <button id="urlBtn" class="url-btn">Fetch</button>
    </div>
    <div class="official-row-inner" id="officialRow" style="display:none;">
      <input type="text" class="url-input" id="artistInput" placeholder="Artist" style="flex:1">
      <input type="text" class="url-input" id="titleInput" placeholder="Song title" style="flex:1">
    </div>
  </div>
</div>

<div class="intro" id="intro">
  <h1>LYRICS</h1>
  <p class="tagline">every word gets its moment in the light</p>
</div>

<audio id="audio" preload="auto"></audio>

<div class="fs-overlay" id="fsOverlay">
  <div class="fs-lyrics" id="fsLyrics"></div>
  <div class="fs-controls">
    <button class="ctrl-btn" id="fsPlayBtn">&#9654;</button>
    <span class="fs-time"><span id="fsCurTime">0:00</span> / <span id="fsDurTime">0:00</span></span>
    <div class="scrub-track" id="fsScrubTrack"><div class="scrub-fill" id="fsScrubFill"></div></div>
    <button class="fs-exit" id="fsExit">Exit (Esc)</button>
  </div>
</div>
