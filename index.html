<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lyrics Karaoke</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a12; --surface:rgba(255,255,255,.06); --surface-raised:rgba(255,255,255,.09);
  --border:rgba(255,255,255,.12); --border-hover:rgba(167,139,250,.6);
  --ink:#ffffff; --ink-muted:rgba(255,255,255,.6); --ink-dim:rgba(255,255,255,.22);
  --accent:#7c6aef; --accent-glow:rgba(124,106,239,.45); --word-active:#fff;
  --radius-sm:12px; --radius-md:18px; --radius-lg:24px;
  --font-body:'DM Sans',system-ui,sans-serif; --font-mono:'Space Mono',monospace;
  --ease:cubic-bezier(.22,.9,.32,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body);
  width:100vw; height:100vh; overflow:hidden; position:relative;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 55% 45% at 15% 0%,rgba(56,189,248,.15),transparent 60%),
    radial-gradient(ellipse 50% 40% at 85% 15%,rgba(167,139,250,.18),transparent 60%),
    radial-gradient(ellipse 60% 45% at 50% 110%,rgba(244,114,182,.12),transparent 60%);
}
::selection{background:rgba(167,139,250,.3)}

/* ================= spotlight ================= */
#spotlight{
  position:fixed; width:500px; height:500px; border-radius:50%; z-index:1;
  pointer-events:none; mix-blend-mode:screen; filter:blur(50px);
  background:radial-gradient(circle,rgba(167,139,250,.28) 0%,rgba(124,106,239,.12) 40%,transparent 70%);
  transform:translate(-50%,-50%); opacity:0; will-change:left,top;
  transition:opacity .5s ease;
}
#spotlight.on{opacity:1}
#mouseGlow{
  position:fixed; width:300px; height:300px; border-radius:50%; z-index:1;
  pointer-events:none; mix-blend-mode:screen; filter:blur(55px);
  background:radial-gradient(circle,rgba(167,139,250,.07) 0%,rgba(124,106,239,.025) 45%,transparent 70%);
  transform:translate(-50%,-50%); opacity:0; will-change:left,top; transition:opacity .5s ease;
}
#mouseGlow.on{opacity:1}

/* ================= lyrics viewport ================= */
.lyrics-viewport{
  position:fixed; inset:0; z-index:3; overflow:hidden;
  -webkit-mask-image:linear-gradient(to bottom,transparent,black 18%,black 82%,transparent);
  mask-image:linear-gradient(to bottom,transparent,black 18%,black 82%,transparent);
  display:flex; align-items:center; justify-content:center;
}
.lyrics-track{
  position:absolute; left:0; right:0; top:0; padding:0 8vw;
  transition:transform .5s var(--ease);
}
.lyric-line{
  display:flex; flex-wrap:wrap; justify-content:center; gap:.4em;
  padding:14px 0; line-height:1.5; text-align:center;
  font-family:var(--font-body); font-weight:400;
  font-size:clamp(18px,3vw,24px);
  opacity:.35;
  transition:opacity .45s ease, font-size .45s var(--ease), transform .45s var(--ease);
  cursor:pointer; border-radius:var(--radius-sm);
}
.lyric-line:hover{opacity:.55}
.lyric-line.near{opacity:.55}
.lyric-line.active{
  opacity:1;
  font-size:clamp(22px,3.6vw,30px); font-weight:600;
  transform:scale(1.02);
}
.word{
  display:inline-block;
  color:var(--ink-dim); opacity:.6;
  transition:color .3s ease, opacity .3s ease, transform .3s var(--ease), text-shadow .3s ease;
}
.word.sung{color:var(--ink-muted); opacity:.85}
.word.lit{
  color:var(--word-active); opacity:1;
  transform:translateY(-1px) scale(1.08);
  text-shadow:0 0 12px var(--accent-glow), 0 0 36px rgba(124,106,239,.4), 0 0 72px rgba(167,139,250,.2);
}

/* ================= intro ================= */
.intro{
  position:fixed; inset:0; z-index:20; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center;
  background:var(--bg); pointer-events:none;
  transition:opacity 1s ease, transform 1s ease;
}
.intro h1{
  font-family:var(--font-mono); font-size:clamp(40px,8vw,80px);
  font-weight:700; letter-spacing:.2em; text-transform:uppercase;
  color:var(--word-active); text-shadow:0 0 30px var(--accent-glow), 0 0 90px rgba(124,106,239,.3);
}
.intro .tagline{margin-top:16px;font-size:14px;color:var(--ink-muted);letter-spacing:.02em}
.intro.hide{opacity:0;transform:translateY(-16px) scale(.98)}
.intro.hide+*{pointer-events:auto}

/* ================= brand ================= */
.brand-mark{
  position:fixed; top:20px; left:24px; z-index:8;
  font-family:var(--font-mono); font-size:11px; letter-spacing:.2em;
  color:var(--ink-muted); opacity:.35;
}

/* ================= upload overlay ================= */
.upload-overlay{
  position:fixed; inset:0; z-index:15;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:rgba(10,10,18,.92); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  transition:opacity .6s ease;
}
.upload-overlay.hidden{opacity:0;pointer-events:none}
.upload-box{
  width:100%; max-width:520px; padding:0 24px;
  display:flex; flex-direction:column; gap:14px;
}
.upload-box h2{
  font-family:var(--font-mono); font-size:1.1rem; font-weight:700;
  letter-spacing:.12em; text-transform:uppercase; text-align:center; margin-bottom:8px;
}
.lang-row{display:flex;justify-content:space-between;align-items:center}
.lang-label{font-size:.72rem;color:var(--ink-dim);letter-spacing:.06em;text-transform:uppercase;font-family:var(--font-mono)}
.lang-select{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
  padding:8px 12px;color:var(--ink);font-family:var(--font-body);font-size:.8rem;outline:none;cursor:pointer;
  transition:border-color .2s;
}
.lang-select:focus{border-color:var(--accent)}
.lang-select option{background:#12121e;color:var(--ink)}
.upload-zone{
  border:1.5px dashed var(--border);border-radius:var(--radius-lg);padding:44px 24px;
  text-align:center;cursor:pointer;transition:border-color .2s,background .2s;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.upload-zone:hover,.upload-zone.dragover{border-color:var(--accent);background:var(--surface)}
.upload-zone .icon{font-size:1.8rem;margin-bottom:12px;opacity:.45}
.upload-zone p{color:var(--ink-muted);font-size:.85rem}
.upload-zone .hint{margin-top:6px;font-size:.72rem;color:var(--ink-dim);letter-spacing:.02em}
.upload-zone input{display:none}
.divider{text-align:center;color:var(--ink-dim);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 0}
.url-row,.official-row{display:flex;gap:8px}
.url-input{
  flex:1;min-width:0;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:11px 14px;color:var(--ink);font-family:var(--font-body);
  font-size:.85rem;outline:none;transition:border-color .2s;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.url-input::placeholder{color:var(--ink-dim)}
.url-input:focus{border-color:var(--accent)}
.url-btn{
  background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);
  padding:11px 20px;font-family:var(--font-body);font-size:.85rem;font-weight:500;
  cursor:pointer;transition:opacity .15s;white-space:nowrap;
}
.url-btn:hover{opacity:.85}
.url-btn:disabled{opacity:.4;cursor:default}

/* ================= controls pill ================= */
.controls-group{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:8;
  display:flex; flex-direction:column; align-items:center; gap:8px;
  opacity:0; transition:opacity .4s ease; pointer-events:none;
}
.controls-group.show{opacity:1;pointer-events:auto}
.controls-pill{
  display:flex; align-items:center; gap:12px;
  background:rgba(10,10,18,.55); border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border-radius:999px; padding:8px 16px;
}
.ctrl-btn{
  width:32px;height:32px;border-radius:50%;flex:none;
  border:1px solid rgba(167,139,250,.3);background:rgba(167,139,250,.08);
  color:var(--word-active);display:flex;align-items:center;justify-content:center;
  cursor:pointer;transition:background .2s,border-color .2s;font-size:.7rem;
}
.ctrl-btn:hover{background:rgba(167,139,250,.2);border-color:var(--accent)}
.ctrl-btn svg{width:12px;height:12px}
.scrub-track{
  position:relative;width:180px;height:3px;border-radius:3px;
  background:rgba(255,255,255,.1);cursor:pointer;
}
.scrub-fill{
  position:absolute;inset:0 auto 0 0;width:0%;border-radius:3px;
  background:linear-gradient(90deg,var(--accent),var(--ink));
}
.scrub-knob{
  position:absolute;top:50%;left:0%;width:9px;height:9px;border-radius:50%;
  background:var(--word-active);transform:translate(-50%,-50%);
  box-shadow:0 0 8px var(--accent-glow);
}
.time-caption{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted);white-space:nowrap}
.speed-btn{
  background:none;border:1px solid var(--border);color:var(--ink-muted);
  font-family:var(--font-mono);padding:3px 8px;border-radius:6px;font-size:.65rem;
  cursor:pointer;transition:border-color .15s,color .15s;
}
.speed-btn:hover{border-color:var(--accent);color:var(--ink)}
.vol-wrap{display:flex;align-items:center;gap:4px}
.vol-icon{color:var(--ink-muted);font-size:.8rem;cursor:pointer}
.vol-slider{
  -webkit-appearance:none;appearance:none;width:60px;height:3px;
  background:var(--border);border-radius:2px;outline:none;cursor:pointer;
}
.vol-slider::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;border-radius:50%;background:var(--accent);cursor:pointer}
.vol-slider::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--accent);cursor:pointer;border:none}

/* ================= status ================= */
#statusArea{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:16;pointer-events:none}
#statusArea .status{text-align:center;padding:16px;color:var(--ink-muted);font-size:.85rem;
  background:rgba(10,10,18,.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--border);border-radius:var(--radius-md);white-space:nowrap;
}
#statusArea .status.loading::after{
  content:'';display:inline-block;width:12px;height:12px;border:1.5px solid var(--border);
  border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;
  margin-left:8px;vertical-align:middle;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ================= tool row ================= */
.tool-row{
  position:fixed;top:20px;right:22px;z-index:8;
  display:flex;gap:8px;align-items:center;
}
.tool-btn{
  background:var(--surface);border:1px solid var(--border);color:var(--ink-muted);
  font-family:var(--font-mono);font-size:.65rem;padding:5px 10px;border-radius:6px;
  cursor:pointer;transition:border-color .15s,color .15s;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.tool-btn:hover{border-color:var(--accent);color:var(--ink)}
.tool-btn:disabled{opacity:.3;cursor:default}

/* ================= official row ================= */
.official-row-inner{
  display:flex;gap:8px;margin-top:10px;
}

/* ================= keyboard hint ================= */
.kbd-hint{
  font-family:var(--font-mono);font-size:10px;color:var(--ink-dim);text-align:center;
}
.kbd-hint kbd{
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);
  border-radius:4px;padding:0 5px;color:var(--ink-muted);
}

/* ================= fullscreen ================= */
.fs-overlay{
  display:none;position:fixed;inset:0;z-index:50;background:var(--bg);flex-direction:column;align-items:center;justify-content:center;
}
.fs-overlay.active{display:flex}
.fs-lyrics{
  width:100%;max-width:800px;flex:1;overflow-y:auto;padding:40vh 32px 40vh;scroll-behavior:smooth;
}
.fs-lyrics::-webkit-scrollbar{width:0}
.fs-lyrics .lyric-line{padding:14px 16px}
.fs-lyrics .lyric-line.future .word{font-size:1.1rem}
.fs-lyrics .lyric-line.past .word{font-size:1.1rem}
.fs-lyrics .lyric-line.active{padding:28px 16px}
.fs-lyrics .lyric-line.active .word{font-size:2rem}
.fs-controls{width:100%;padding:20px 32px;display:flex;align-items:center;gap:16px}
.fs-controls .scrub-track{flex:1;margin-bottom:0}
.fs-exit{
  background:none;border:1px solid var(--border);color:var(--ink-muted);
  font-family:var(--font-mono);font-size:.65rem;padding:5px 10px;border-radius:6px;
  cursor:pointer;transition:border-color .15s,color .15s;
}
.fs-exit:hover{border-color:var(--accent);color:var(--ink)}
.fs-time{font-family:var(--font-mono);font-size:.75rem;color:var(--ink-muted);white-space:nowrap}

@media (max-width:600px){
  .lyrics-track{padding:0 6vw}
  .upload-box{padding:0 16px}
  .scrub-track{width:120px}
  .brand-mark{font-size:10px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<div id="spotlight"></div>
<div id="mouseGlow"></div>

<div class="brand-mark">LYRICS</div>

<div class="tool-row" id="toolBtns" style="display:none;">
  <button class="tool-btn" id="officialBtn" title="Search official lyrics">Official lyrics</button>
  <button class="tool-btn" id="fsBtn" title="Fullscreen (F)">&#9974;</button>
  <button class="tool-btn" id="exportLrc" title="Export .lrc">.lrc</button>
  <button class="tool-btn" id="exportSrt" title="Export .srt">.srt</button>
</div>

<div class="lyrics-viewport" id="lyricsViewport">
  <div class="lyrics-track" id="lyricsTrack"></div>
</div>

<div class="controls-group" id="controlsGroup">
  <div class="controls-pill">
    <button class="ctrl-btn" id="playBtn" aria-label="play/pause">&#9654;</button>
    <div class="scrub-track" id="scrubTrack" tabindex="0">
      <div class="scrub-fill" id="scrubFill"></div>
      <div class="scrub-knob" id="scrubKnob"></div>
    </div>
    <span class="time-caption"><span id="curTime">0:00</span> / <span id="durTime">0:00</span></span>
    <button class="speed-btn" id="speedBtn">1.0x</button>
    <div class="vol-wrap">
      <span class="vol-icon" id="volIcon">&#128266;</span>
      <input type="range" class="vol-slider" id="volSlider" min="0" max="1" step="0.05" value="1">
    </div>
    <button class="ctrl-btn" id="fsBtnPill" aria-label="fullscreen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3m11-5v3a2 2 0 0 1-2 2h-3"/></svg>
    </button>
  </div>
  <p class="kbd-hint" id="kbdHint"></p>
</div>

<div id="statusArea"></div>

<div class="upload-overlay" id="uploadOverlay">
  <div class="upload-box">
    <h2>LYRICS</h2>
    <div class="lang-row">
      <span class="lang-label">Language</span>
      <select id="langSelect" class="lang-select">
        <option value="auto">Auto-detect</option>
        <option value="en" selected>English</option>
        <option value="ar">Arabic</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="ja">Japanese</option>
        <option value="ko">Korean</option>
        <option value="zh">Chinese</option>
        <option value="hi">Hindi</option>
        <option value="pt">Portuguese</option>
        <option value="ru">Russian</option>
        <option value="tr">Turkish</option>
      </select>
    </div>
    <div class="upload-zone" id="dropZone">
      <div class="icon">&#9835;</div>
      <p>Drop an audio file or click to browse</p>
      <p class="hint">MP3 &middot; WAV &middot; FLAC &middot; OGG</p>
      <input type="file" id="fileInput" accept="audio/*">
    </div>
    <div class="divider">or</div>
    <div class="url-row">
      <input type="text" id="urlInput" class="url-input" placeholder="Paste a YouTube URL...">
      <button id="urlBtn" class="url-btn">Fetch</button>
    </div>
    <div class="official-row-inner" id="officialRow" style="display:none;">
      <input type="text" class="url-input" id="artistInput" placeholder="Artist" style="flex:1">
      <input type="text" class="url-input" id="titleInput" placeholder="Song title" style="flex:1">
    </div>
  </div>
</div>

<div class="intro" id="intro">
  <h1>LYRICS</h1>
  <p class="tagline">every word gets its moment in the light</p>
</div>

<audio id="audio" preload="auto"></audio>

<div class="fs-overlay" id="fsOverlay">
  <div class="fs-lyrics" id="fsLyrics"></div>
  <div class="fs-controls">
    <button class="ctrl-btn" id="fsPlayBtn">&#9654;</button>
    <span class="fs-time"><span id="fsCurTime">0:00</span> / <span id="fsDurTime">0:00</span></span>
    <div class="scrub-track" id="fsScrubTrack"><div class="scrub-fill" id="fsScrubFill"></div></div>
    <button class="fs-exit" id="fsExit">Exit (Esc)</button>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
